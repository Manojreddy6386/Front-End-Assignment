
<!DOCTYPE html>
<html>
<head>
<title>Product Showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f0eb;
    padding: 25px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.product-card {
    display: grid;
    grid-template-columns: 1fr;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0,0,0,0.1);
}

.product-image {
    width: 100%;
    height: 300px;
    object-fit: cover;
    transition: transform 0.3s;
}

.product-image:hover {
    transform: scale(1.04);
}

.details {
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.category {
    color: #9b7653;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

h1 {
    font-size: 27px;
    color: #333;
}

.description {
    color: #777;
    line-height: 1.6;
}

.rating {
    color: #d49b32;
}

.price-section {
    display: flex;
    align-items: center;
    gap: 12px;
}

.price {
    font-size: 26px;
    font-weight: bold;
    color: #333;
}

.old-price {
    color: #999;
    text-decoration: line-through;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #85634b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

@media (min-width: 768px) {
    .product-card {
        grid-template-columns: 1fr 1fr;
        align-items: center;
    }

    .product-image {
        height: 100%;
        min-height: 400px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="product-card">

        <img class="product-image"
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800"
        alt="Red sneakers">

        <div class="details">

            <p class="category">Footwear Collection</p>

            <h1>Classic Red Sneakers</h1>

            <p class="description">
                Comfortable and stylish sneakers designed
                for everyday use. Perfect for casual outings
                and daily activities.
            </p>

            <div class="rating">★★★★★ (4.8/5)</div>

            <div class="price-section">
                <span class="price">₹1,999</span>
                <span class="old-price">₹2,999</span>
            </div>

            <button>Add to Bag</button>

        </div>
    </div>
</div>

</body>
</html>
